<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minus – 2. Klasse</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="hud" class="hud">
    <div class="hudLeft">
      <div id="levelBtns" class="levelBtns">
        <button type="button" class="lvlBtn" data-level="1">ZR 10</button>
        <button type="button" class="lvlBtn" data-level="2">ZR 20</button>
        <button type="button" class="lvlBtn" data-level="3">ZR 100: Z-E</button>
        <button type="button" class="lvlBtn" data-level="4">ZR 100: ZE-E oUS</button>
        <button type="button" class="lvlBtn" data-level="5">ZR 100: ZE-E mUS</button>
        <button type="button" class="lvlBtn" data-level="6">ZR 100: ZE-ZE mUS</button>
      </div>
      <div class="scoreBoxes">
        <div class="scoreBox green">✓ <span id="okCount">0</span></div>
        <div class="scoreBox red">✗ <span id="badCount">0</span></div>
      </div>
    </div>
    <button type="button" id="pointsBtn" class="pointsBtn" title="Zehnerstangen und Einerwürfel ein- oder ausblenden">Zehner / Einer</button>
  </div>
  <h1>Wähle deinen Rechenweg!</h1>
  <div id="layout">
    <div id="vizPanel" class="vizPanel"><div id="vizWrap" class="vizWrap"></div></div>
    <div id="app"></div>
  </div>
  <button type="button" id="nextBtn" class="next-rechnung">Nächste Rechnung</button>
  <button type="button" id="endBtn" class="endBtn">Ende</button>
  <script src="./script.js"></script>
</body>
</html>
